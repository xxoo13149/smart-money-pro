<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymarket Smart Labels</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-shell">
    <main class="popup-app">
      <header class="popup-header">
        <div class="header-copy">
          <p class="eyebrow">Smart Labels</p>
          <h1>扩展登录与运行面板</h1>
          <p class="subtitle">
            首次使用请填写邮箱、密码和邀请码完成绑定。绑定后，后续只需要邮箱和密码即可继续使用。
          </p>
        </div>
        <div class="status-sphere">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text" class="status-chip" data-tone="neutral">未连接</span>
        </div>
      </header>

      <section class="session-card">
        <form id="login-form" class="login-form">
          <label class="field">
            <span class="field-label">邮箱</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">密码</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="请输入密码"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">邀请码</span>
            <input
              id="invite-code"
              name="inviteCode"
              type="text"
              autocomplete="off"
              placeholder="首次绑定时填写，后续登录可留空"
            />
          </label>

          <p class="field-help">
            同一个邀请码只能绑定一个用户账户。邀请码一旦绑定成功，这个账户之后就不需要再次输入邀请码。
          </p>

          <button type="submit" id="login-button" class="primary-button">登录并绑定账户</button>
        </form>

        <div id="session-panel" class="session-panel hidden">
          <div class="session-meta session-meta--stack">
            <div>
              <p class="session-label">账户邮箱</p>
              <strong id="session-email">未登录</strong>
            </div>
            <div>
              <p class="session-label">团队身份</p>
              <strong id="session-member">未登录</strong>
            </div>
            <div>
              <p class="session-label">绑定邀请码</p>
              <strong id="session-invite">未绑定</strong>
            </div>
            <div>
              <p class="session-label">连接状态</p>
              <strong id="session-status">未连接</strong>
            </div>
          </div>

          <dl class="session-grid">
            <div>
              <dt>访问令牌到期</dt>
              <dd id="expires-at">-</dd>
            </div>
            <div>
              <dt>刷新会话到期</dt>
              <dd id="refresh-expires-at">-</dd>
            </div>
            <div>
              <dt>最近同步</dt>
              <dd id="last-sync">-</dd>
            </div>
            <div>
              <dt>后端地址</dt>
              <dd id="backend-origin">-</dd>
            </div>
          </dl>
        </div>

        <div class="session-controls">
          <label class="toggle-field">
            <input type="checkbox" id="toggle-enabled" />
            <span>启用 Polymarket 页内标注</span>
          </label>
          <label class="toggle-field hidden" id="debug-controls">
            <input type="checkbox" id="toggle-debug" />
            <span>调试模式</span>
          </label>
          <div class="feature-status">
            <span class="feature-pill">运行状态</span>
            <span class="feature-copy" id="runtime-target">等待连接</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="panel-title">快捷入口</p>
              <p class="panel-subtitle">
                打开侧边面板、管理后台或 Polymarket 页面，并检查当前运行状态是否正常。
              </p>
            </div>
          </div>
          <div class="session-actions">
            <button type="button" id="open-sidepanel-button" class="primary-button">打开侧边面板</button>
            <button type="button" id="open-workbench-button" class="secondary-button">打开管理后台</button>
          </div>
        </div>

        <div class="quick-links">
          <button type="button" id="open-polymarket-button" class="secondary-button">打开 Polymarket</button>
          <button type="button" id="refresh-state-button" class="secondary-button ghost">刷新状态</button>
          <button type="button" id="logout-button" class="ghost-button">退出登录</button>
        </div>
      </section>

      <footer class="popup-footer">
        <a id="privacy-link" href="#" target="_blank" rel="noreferrer">隐私说明</a>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
